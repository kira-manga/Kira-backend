# Version catalog — the single place versions are pinned (PLAN.md §3 version-pinning rule).
#
# These versions were verified mutually compatible once at scaffold (Phase 1) and are now
# reproducible: builds resolve exactly these versions. After Phase 1 they change only as
# deliberate commits, never by floating ranges. The owner authorized the separate Boot 4.0
# migration on 2026-10-19; runtime/security/persistence verification remains mandatory.
#
# BOM-managed (versions supplied by the Spring Boot dependency BOM, recorded in README):
#   - org.postgresql:postgresql (JDBC driver)
#   - org.testcontainers:{postgresql,junit-jupiter}
#   - Kotlin stdlib/reflect are forced to the `kotlin` version below via the BOM
#     property override (`extra["kotlin.version"]`) in build.gradle.kts so the runtime
#     stdlib matches the compiler.
#   - Serialization's root/JVM/core/BOM use `kotlinxSerialization` through the exact
#     Boot property `extra["kotlin-serialization.version"]`, not only the JSON root pin.

[versions]
kotlin = "2.2.21"                       # Kotlin plugins + stdlib, aligned with source-engine 0.2.6
springBoot = "4.0.8"                    # Owner-authorized Boot 4.0 migration; Spring 7.0.9 security fixes
springDependencyManagement = "1.1.7"    # io.spring.dependency-management (applies the Boot BOM)
kotlinxSerialization = "1.9.0"          # Root/JVM/core/BOM runtime required by source-engine 0.2.6
springdoc = "3.0.3"                     # springdoc-openapi 3.0.x = the Spring Boot 4.0.x line
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
cycloneDx = "3.2.4"
jackson = "2.21.7"                       # Jackson 2 compatibility security patch; not the Jackson 3 BOM
commonsLang3 = "3.20.0"                  # security patch above Boot 4.0.8 BOM's 3.19.0
commonsCompress = "1.28.0"               # security floor for transitive test archive handling
log4j2 = "2.25.5"                         # fixes CVE-2026-49844; also the Boot 4.0.8 managed version

# Non-Gradle pins (recorded here for provenance; referenced textually where used):
#   Gradle wrapper .......... 8.14.5   (gradle/wrapper/gradle-wrapper.properties)
#   Java toolchain .......... 21       (build.gradle.kts)
#   PostgreSQL Docker image . postgres:17.6-alpine  (docker-compose.yml + Testcontainers base)

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cycloneDx" }

[libraries]
# Explicitly-versioned libraries (everything else is Boot-BOM-managed and versionless below).
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
