name: Backend25 26 targeted image and disposable recovery gate

on:
  push:
    branches: [remediation/backend2526-image-gate-20260915-04]

permissions:
  contents: read
  packages: read

concurrency:
  group: backend2526-image-gate-20260915-01
  cancel-in-progress: false

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_CHECKS_ANNOTATIONS: "false"

jobs:
  image-recovery:
    if: >-
      github.repository == 'kira-manga/Kira-backend' &&
      github.event.repository.full_name == 'kira-manga/Kira-backend' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/remediation/backend2526-image-gate-20260915-04' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    # Separately admitted shared-scope proposal: H1 <=30m, H2 <=600s, outer cleanup.
    # This is not a retry or an increase to a failed H1 execution's ceiling.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Start the fixed shared-scope clock
        timeout-minutes: 1
        run: |
          set -euo pipefail
          printf 'B2526_STARTED=%s\n' "$(python3 -I -B -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"

      - name: Read the exact public carrier and its single product parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Refuse unbound admission and allocate owned resources
        id: prepare
        timeout-minutes: 2
        run: python3 -I -B ci/backend2526-h1/gate.py prepare

      - name: Use a fresh dedicated Buildx instance
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        timeout-minutes: 2
        with:
          name: ${{ steps.prepare.outputs.builder }}
          driver: docker-container
          use: false
          cleanup: false
          cache-binary: false
          keep-state: false

      - name: Build and load one unchanged production image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        timeout-minutes: 15
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: kira-backend:${{ github.sha }}
          build-args: |
            VERSION=1.0.0
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
            KIRA_PACKAGES_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
          # No shared cache import/export. The dedicated builder's entire cache is removed.

      - name: H1 exact-ID production smoke, published JAR pins, real save-remove-load
        timeout-minutes: 30
        env:
          BUILDX_IMAGE_ID: ${{ steps.image.outputs.imageid }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 -I -B ci/backend2526-h1/gate.py h1

      - name: H2 separately bound fixed recovery adapter on the same retained image
        if: ${{ success() && steps.prepare.outputs.h2 == 'bound' }}
        timeout-minutes: 11
        run: python3 -I -B ci/backend2526-h1/gate.py h2

      - name: Independently close owned Docker resources, image, cache and private scratch
        if: ${{ always() && steps.prepare.outputs.scratch != '' }}
        timeout-minutes: 4
        run: python3 -I -B ci/backend2526-h1/gate.py finish

      - name: Retain only small sanitized non-production gate records
        if: ${{ always() && steps.prepare.outputs.evidence != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: backend2526-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.evidence }}/result.json
            ${{ steps.prepare.outputs.evidence }}/bindings.json
            ${{ steps.prepare.outputs.evidence }}/h1.json
            ${{ steps.prepare.outputs.evidence }}/h2.json
            ${{ steps.prepare.outputs.evidence }}/cleanup.json
            ${{ steps.prepare.outputs.evidence }}/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
          overwrite: false
          compression-level: 9
