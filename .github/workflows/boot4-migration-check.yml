name: Backend Boot 4 migration compile

on:
  push:
    branches: [remediation/backend-boot4-20261019]

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-boot4-migration
  cancel-in-progress: false

jobs:
  compile:
    if: github.repository_id == '1304735394' && github.ref == 'refs/heads/remediation/backend-boot4-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Allocate owned Gradle and evidence directories
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          GRADLE_USER_HOME="$RUNNER_TEMP/kira-boot4-gradle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          EVIDENCE="$RUNNER_TEMP/kira-boot4-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir --mode=700 "$GRADLE_USER_HOME" "$EVIDENCE"
          printf 'GRADLE_USER_HOME=%s\nEVIDENCE=%s\n' "$GRADLE_USER_HOME" "$EVIDENCE" >> "$GITHUB_ENV"
      - name: Resolve locks and compile migrated source (no release)
        id: resolve
        env:
          KIRA_PACKAGES_USER: ${{ github.actor }}
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KIRA_PACKAGES_READ_TOKEN"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/source.txt"
          gradle() {
            ./gradlew --no-daemon --no-parallel --max-workers=2 --no-build-cache --no-configuration-cache \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process "$@"
          }
          # Gradle persists locks only after a successful invocation, not a failed compile.
          gradle dependencies --write-locks 2>&1 | tee "$EVIDENCE/dependencies.log"
          if grep -q ' FAILED' "$EVIDENCE/dependencies.log"; then
            echo 'Dependency resolution failed; refusing incomplete locks' >&2
            exit 1
          fi
          grep -q '^org.springframework.boot:spring-boot:4.0.8=' gradle.lockfile
          grep -q '^org.springframework:spring-webmvc:7.0.9=' gradle.lockfile
          printf 'locks_ready=true\n' >> "$GITHUB_OUTPUT"
          gradle compileTestKotlin 2>&1 | tee "$EVIDENCE/gradle.log"
      - name: Scan the actual generated migration dependency lock
        if: always() && steps.resolve.outputs.locks_ready == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          osv_image=ghcr.io/google/osv-scanner@sha256:64e86bec6df2466feea5137fc7c78fb3b7c21ec077f014d7130f64810e50676b
          docker run --rm --volume "$GITHUB_WORKSPACE/gradle.lockfile:/src/gradle.lockfile:ro" \
            --volume "$EVIDENCE:/reports" "$osv_image" scan source \
            --lockfile /src/gradle.lockfile --format json --output-file /reports/osv.json
      - name: Stop owned Gradle and preserve generated locks
        id: stop
        if: always() && steps.paths.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$GRADLE_USER_HOME" = "$RUNNER_TEMP/kira-boot4-gradle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$EVIDENCE"
          if [[ -d "$GRADLE_USER_HOME/daemon" ]]; then
            test -O "$GRADLE_USER_HOME" && test ! -L "$GRADLE_USER_HOME"
            shopt -s nullglob
            bins=("$GRADLE_USER_HOME"/wrapper/dists/gradle-8.14.5-bin/*/gradle-8.14.5/bin/gradle)
            test "${#bins[@]}" -eq 1
            timeout --kill-after=5s 60s "${bins[0]}" --stop
          fi
          cp -- gradle.lockfile "$EVIDENCE/gradle.lockfile"
          git diff -- gradle.lockfile > "$EVIDENCE/locks.diff"
          df -h .
          free -h
      - name: Preserve compilation evidence
        id: reports
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot4-migration-${{ github.sha }}
          path: ${{ env.EVIDENCE }}
          retention-days: 1
          if-no-files-found: error
      - name: Remove only owned disposable outputs
        if: always() && steps.stop.outcome == 'success' && steps.reports.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test "$GRADLE_USER_HOME" = "$RUNNER_TEMP/kira-boot4-gradle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$EVIDENCE" = "$RUNNER_TEMP/kira-boot4-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for path in build .gradle .kotlin "$GRADLE_USER_HOME" "$EVIDENCE"; do
            test ! -L "$path"
          done
          test -z "$(git ls-files -- build .gradle .kotlin)"
          rm -rf -- build .gradle .kotlin "$GRADLE_USER_HOME" "$EVIDENCE"
