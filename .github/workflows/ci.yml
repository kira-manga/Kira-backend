name: CI

on:
  pull_request:
  push:
    branches: [main, production-hardening, "feature/**"]

permissions:
  contents: read
  packages: read

env:
  KIRA_PACKAGES_USER: ${{ github.actor }}
  KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Full Gradle verification
        run: ./gradlew --no-daemon clean check
      - name: Offline image promotion and shared receiver contracts
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_image_release.py' -v
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/detekt

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Generate SBOM
        run: ./gradlew --no-daemon cyclonedxBom
      - name: Fail-closed dependency vulnerability scan
        run: |
          mkdir -p build/reports
          osv_image=ghcr.io/google/osv-scanner@sha256:64e86bec6df2466feea5137fc7c78fb3b7c21ec077f014d7130f64810e50676b
          docker run --rm --volume "$GITHUB_WORKSPACE/gradle.lockfile:/src/gradle.lockfile:ro" \
            --volume "$GITHUB_WORKSPACE/build/reports:/reports" "$osv_image" scan source \
            --lockfile /src/gradle.lockfile --format json --output-file /reports/osv.json
      - name: Secret scan
        shell: bash
        run: |
          gitleaks_version=8.30.1
          gitleaks_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$gitleaks_sha256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact \
            --report-format json --report-path build/reports/gitleaks.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supply-chain-reports
          path: |
            build/reports/cyclonedx.*
            build/reports/osv.json
            build/reports/gitleaks.json

  observability-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      KIRA_PACKAGES_USER: ""
      KIRA_PACKAGES_READ_TOKEN: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate recovery rules and scrape template
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP:?}/kira-promtool.XXXXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          version=3.14.0
          archive="prometheus-${version}.linux-amd64.tar.gz"
          # Official v3.14.0 sha256sums.txt; only promtool is extracted from the pinned archive.
          sha256=f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/prometheus/prometheus/releases/download/v${version}/${archive}" \
            --output "$work/$archive"
          printf '%s  %s\n' "$sha256" "$work/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$work/$archive" --directory "$work" \
            "prometheus-${version}.linux-amd64/promtool"
          promtool="$work/prometheus-${version}.linux-amd64/promtool"
          timeout --kill-after=5s 30s "$promtool" check rules deploy/observability/alerts.yaml
          timeout --kill-after=5s 60s "$promtool" test rules deploy/observability/alerts.test.yaml
          timeout --kill-after=5s 30s "$promtool" check config deploy/observability/prometheus-scrape.yaml

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact-SHA production image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: kira-backend:${{ github.sha }}
          build-args: |
            VERSION=1.0.0
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
            KIRA_PACKAGES_USER=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Allocate owned image scratch
        id: scratch
        run: python3 -B scripts/ci/image_release.py scratch
      - name: Production-profile immutable-ID smoke and one export
        env:
          SCRATCH: ${{ steps.scratch.outputs.path }}
          BUILDX_IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: python3 -B scripts/ci/image_release.py produce
      - name: Validate deployment manifests
        run: |
          kubectl_image=registry.k8s.io/kubectl@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          docker run --rm --volume "$GITHUB_WORKSPACE/deploy/kubernetes:/work:ro" "$kubectl_image" \
            kustomize /work/base > /tmp/kira-rendered.yaml
          kubeconform_image=ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          docker run --rm --volume /tmp/kira-rendered.yaml:/work/kira-rendered.yaml:ro "$kubeconform_image" \
            -strict -summary -kubernetes-version 1.34.1 /work/kira-rendered.yaml
      - name: Retain only the successful main attempt's exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.scratch.outputs.path }}/image.tar.gz
            ${{ steps.scratch.outputs.path }}/receipt.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 3
      - name: Remove only owned image scratch
        if: always() && steps.scratch.outputs.path != ''
        env:
          SCRATCH: ${{ steps.scratch.outputs.path }}
        run: python3 -B scripts/ci/image_release.py cleanup
