import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.gradle.api.GradleException
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.tasks.testing.Test
import org.gradle.testing.jacoco.plugins.JacocoTaskExtension

// Public exact1 PG04 MODEL-only derivative; prior evidence remains private and unchanged.
// Reuses the existing owned hosted context; no controller, process, fixture or dependency replacement.
def profileSha256 = '0a07e8834d3b8d5f17dcc0eed167ef003cf5604d4737d28f04cd105b29fcf44e' // Candidate pin only; request/branch remain UNBOUND pending review.
if (!(profileSha256 instanceof String) || !(profileSha256 ==~ /[0-9a-f]{64}/) || profileSha256 == '0' * 64) {
    throw new GradleException('Inert lease-dispatch derivative: final profile hash is UNBOUND')
}
def runPath = System.getenv('W01_RUN')
if (!runPath) throw new GradleException('W01_RUN is required')
def run = new File(runPath).canonicalFile
def root = new File(System.getenv('GATE_B_ADMIN')).canonicalFile
def backend = new File(System.getenv('GATE_B_BACKEND')).canonicalFile
def javaHome = new File(System.getenv('JAVA_HOME')).canonicalPath
if (run != new File(System.getenv('GATE_B_RUN'), 'w01').canonicalFile) throw new GradleException('Wrong owned hosted lane')
def sha256 = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
def profileFile = new File(root, 'profile/profile.json')
if (sha256(profileFile) != profileSha256) {
    throw new GradleException('Changed exact1 PG04 MODEL-only profile')
}
def profile = new JsonSlurper().parse(profileFile)
def exactMethods = profile.test_selectors
if (profile.profile_id != 'app-29-lease-dispatch-pg-profile-04' || profile.expected_test_count != 1 ||
        exactMethods.size() != 1 || exactMethods.toSet().size() != 1 || profile.expected_witnesses != [] ||
        profile.expected_tests.size() != 1 ||
        profile.expected_tests.collect { it['class'] + '.' + it.display_name }.toSet().size() != 1 ||
        profile.expected_tests.collect { it['class'] + '.' + it.method }.unique() != exactMethods ||
        profile.task_args != (['test'] + exactMethods.collectMany { ['--tests', it] })) {
    throw new GradleException('Require exactly1 literal MODEL filter/3 argv and1 invocation, without mixed-PASS/enum/prior16/consumer-witness replay')
}
def originalInit = new File(run, 'original.init.gradle')
if (sha256(originalInit) != profile.original_init.sha256) throw new GradleException('Changed historical source init')
apply from: originalInit

def finalJar = new File(root, profile.final_jar.path).canonicalFile
def checker = new File(root, profile.checker.path).canonicalFile
def verifyInputs = {
    [[file: finalJar, pin: profile.final_jar], [file: checker, pin: profile.checker]].each { item ->
        if (!item.file.isFile() || item.file.length() != item.pin.bytes || sha256(item.file) != item.pin.sha256) {
            throw new GradleException('Changed explicit consumer input: ' + item.file)
        }
    }
}
verifyInputs()

gradle.projectsEvaluated {
    def p = gradle.rootProject
    if (p.name != 'kira-backend' || p.projectDir.canonicalFile != backend) {
        throw new GradleException('Diagnostic profile requires the bound backend checkout')
    }
    p.tasks.named('jacocoTestReport').configure { enabled = false }
    p.tasks.named('test', Test).configure { test ->
        def resolved = p.configurations.getByName('testRuntimeClasspath').incoming.artifacts.artifacts
        def moduleArtifacts = { String group, String module ->
            resolved.findAll { artifact ->
                def id = artifact.id.componentIdentifier
                id instanceof ModuleComponentIdentifier && id.group == group && id.module == module
            }
        }
        def stock = moduleArtifacts(profile.removed_stock.group, profile.removed_stock.module)
        if (stock.size() != 1 || stock[0].id.componentIdentifier.version != profile.removed_stock.version ||
                sha256(stock[0].file) != profile.removed_stock.sha256 || !test.classpath.contains(stock[0].file)) {
            throw new GradleException('Expected exactly the recorded stock runtime artifact before removal')
        }
        def checkers = moduleArtifacts('org.checkerframework', 'checker-qual')
        if (checkers.size() > 1 || checkers.any {
            it.id.componentIdentifier.version != '3.55.1' || sha256(it.file) != profile.checker.sha256
        }) throw new GradleException('Refusing an unreviewed Checker version/byte replacement')
        def removed = [stock[0].file] + checkers.collect { it.file }
        def beforeClasspath = test.classpath
        test.classpath = beforeClasspath.minus(p.files(removed)).plus(p.files(finalJar, checker))
        // Exact space-containing JVM method names; CLI and programmatic include sets intersect.
        test.filter.setIncludePatterns(exactMethods as String[])
        test.filter.failOnNoMatchingTests = true
        test.maxParallelForks = 1
        test.forkEvery = 0
        test.systemProperty('junit.jupiter.execution.parallel.enabled', 'false')
        test.outputs.upToDateWhen { false }
        test.extensions.getByType(JacocoTaskExtension).enabled = false

        def report = p.layout.buildDirectory.dir(profile.report_directory).get().asFile
        test.systemProperty('kira.finalJarConsumer.profile', profile.profile_id)
        // Retained compatibility properties; the two positive-witness methods are unselected.
        test.systemProperty('kira.finalJarConsumer.gate', profile.original_provider_gate)
        test.systemProperty('java.io.tmpdir', System.getenv('TMPDIR'))
        test.systemProperty('user.home', System.getenv('HOME'))
        test.systemProperty('kira.finalJarConsumer.jar', finalJar.path)
        test.systemProperty('kira.finalJarConsumer.checker', checker.path)
        test.systemProperty('kira.finalJarConsumer.javaHome', javaHome)
        test.systemProperty('kira.finalJarConsumer.report', new File(report, profile.witness_property_file).path)
        test.jvmArgs('-XX:+DisableAttachMechanism', '-XX:-EnableDynamicAgentLoading',
                '-Xlog:class+load=info:file=' + new File(report, 'class-load-%p.txt').path + ':uptime,level,tags')

        test.doFirst {
            verifyInputs()
            def launcher = test.javaLauncher.get().metadata
            if (launcher.installationPath.asFile.canonicalPath != javaHome ||
                    launcher.languageVersion.asInt() != 21 || test.extensions.getByType(JacocoTaskExtension).enabled) {
                throw new GradleException('Require the trusted uninstrumented JDK21 worker')
            }
            def forbidden = ['-javaagent:', '-agentlib:', '-agentpath:', '-Xbootclasspath', '--patch-module',
                    '--upgrade-module-path', '--module-path', '-Djava.system.class.loader', '-Djava.class.path=',
                    '-Djdk.util.jar.', '-XX:SharedArchiveFile=', '-XX:ArchiveClassesAtExit=']
            if (test.allJvmArgs.any { arg -> forbidden.any { arg.startsWith(it) } } ||
                    ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'].any { test.environment.containsKey(it) }) {
                throw new GradleException('Refusing loader/MR/agent override')
            }
            def allowedDirectories = ['classes/java/main', 'classes/java/test', 'classes/kotlin/main',
                    'classes/kotlin/test', 'resources/main', 'resources/test'].collect {
                new File(p.layout.buildDirectory.get().asFile, it).canonicalFile
            }
            def entries = test.classpath.files.collect { raw ->
                def file = raw.canonicalFile
                def entry = [path: file.path, sha256: null, postgres_classes: 0, checker_classes: 0, postgres_services: 0]
                def inspectName = { String name ->
                    def base = name.replaceFirst('^META-INF/versions/[0-9]+/', '')
                    if (base.endsWith('.class') && base.startsWith('org/postgresql/')) entry.postgres_classes++
                    if (base.endsWith('.class') && base.startsWith('org/checkerframework/')) entry.checker_classes++
                }
                if (file.isFile() && file.name.endsWith('.jar')) {
                    entry.sha256 = sha256(file)
                    new ZipFile(file).withCloseable { zip ->
                        zip.entries().each { member ->
                            inspectName(member.name)
                            if (member.name == 'META-INF/services/java.sql.Driver') {
                                zip.getInputStream(member).withCloseable { input ->
                                    entry.postgres_services += input.getText('UTF-8').readLines().count {
                                        it.split('#', 2)[0].trim().startsWith('org.postgresql.')
                                    }
                                }
                            }
                        }
                        def manifest = zip.getEntry('META-INF/MANIFEST.MF')
                        if (manifest != null) zip.getInputStream(manifest).withCloseable { input ->
                            if (new Manifest(input).mainAttributes.getValue('Class-Path')?.trim()) {
                                throw new GradleException('Implicit manifest Class-Path is outside the reviewed overlay: ' + file)
                            }
                        }
                    }
                } else if (allowedDirectories.contains(file) && (!file.exists() || file.isDirectory())) {
                    if (file.isDirectory()) file.eachFileRecurse(groovy.io.FileType.FILES) { child ->
                        inspectName(file.toPath().relativize(child.toPath()).toString())
                    }
                } else {
                    throw new GradleException('Unexpected/native classpath output: ' + file)
                }
                if ((entry.postgres_classes > 0 || entry.postgres_services > 0) && file != finalJar ||
                        entry.checker_classes > 0 && file != checker || removed.any { it.canonicalFile == file }) {
                    throw new GradleException('Foreign/duplicate consumer class supplier: ' + file)
                }
                entry
            }
            if (entries.count { it.postgres_classes > 0 } != 1 || entries.count { it.checker_classes > 0 } != 1 ||
                    entries.sum { it.postgres_services } != 1) throw new GradleException('Incomplete one-provider overlay')
            report.mkdirs()
            new File(report, 'effective-classpath.txt').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    profile: profile.profile_id, source_inventory: profile.source_inventory,
                    expected_test_count: profile.expected_test_count, expected_witnesses: profile.expected_witnesses,
                    scope: 'Exact1 PG04 MODEL-only validation only; classpath context, not consumer/JAR/W03 qualification',
                    removed_stock: [component: stock[0].id.componentIdentifier.displayName,
                                    path: stock[0].file.canonicalPath, sha256: sha256(stock[0].file)],
                    deduplicated_checker: checkers.collect { [path: it.file.canonicalPath, sha256: sha256(it.file)] },
                    java_home: launcher.installationPath.asFile.canonicalPath,
                    java_runtime_version: launcher.javaRuntimeVersion,
                    planned_jvm_args: test.allJvmArgs, entries: entries])) + '\n'
        }
    }
}
