groups:
  - name: kira-backend
    rules:
      - alert: KiraBackendUnavailable
        expr: up{job="kira-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Kira backend is unavailable"}

      - alert: KiraBackendHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="kira-backend",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="kira-backend"}[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Kira backend 5xx rate exceeds 5%"}

      - alert: KiraBackendHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="kira-backend"}[10m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Kira backend p95 latency exceeds one second"}

      - alert: KiraDatabasePoolExhaustion
        expr: hikaricp_connections_active{job="kira-backend"} / clamp_min(hikaricp_connections_max{job="kira-backend"}, 1) > 0.9
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Kira database pool is over 90% utilized"}

      - alert: KiraMigrationFailed
        expr: kube_job_status_failed{namespace="kira",job_name=~"kira-backend-migrate.*"} > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Kira Flyway migration Job failed"}

      - alert: KiraAuthenticationThrottleSpike
        expr: sum(rate(kira_auth_throttle_events_total{job="kira-backend",outcome=~"blocked|unavailable"}[5m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Authentication throttling is elevated"}

      - alert: KiraCompletionQueueSaturated
        expr: kira_completion_queue_remaining{job="kira-backend"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Completion provider queue is saturated"}

      - alert: KiraCompletionQuotaSpike
        expr: sum(rate(kira_completion_admission_events_total{job="kira-backend"}[5m])) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Completion admission rejections are elevated"}

      - alert: KiraPublicationFailures
        expr: |
          sum(rate(http_server_requests_seconds_count{job="kira-backend",uri=~".*/publish|.*/rollback",status=~"5.."}[10m])) > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Source publication or rollback is failing"}

      - alert: KiraImportFailures
        expr: |
          sum(rate(http_server_requests_seconds_count{job="kira-backend",uri=~".*/import-bundled",status=~"5.."}[10m])) > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Bundled source imports are failing"}

      - alert: KiraBackupStale
        expr: |
          group by (job, service, environment) (
            (time() - kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"} > 900)
            and (kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"} > 0)
          )
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "No verified Kira backup has completed within the 15-minute RPO"}

      - alert: KiraRestoreVerificationStale
        expr: |
          group by (job, service, environment) (
            (time() - kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"} > 2678400)
            and (kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"} > 0)
          )
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "Kira disposable restore verification is older than 31 days"}

      # One declared logical scope per role; instance/producer changes must not reset `for`.
      # Absence recognition includes Prometheus lookback/staleness delay before this 5m grace.
      - alert: KiraBackupTelemetryUnavailable
        expr: |
          group by (job, service, environment) (
            absent(kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"})
            or (kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"} <= 0)
            or (kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"} > time())
            or (kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"}
                != kira_backup_last_success_timestamp_seconds{job="kira-backup",service="kira-backend",environment="production"})
          )
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Verified Kira backup telemetry is absent or invalid"}

      - alert: KiraRestoreVerificationTelemetryUnavailable
        expr: |
          group by (job, service, environment) (
            absent(kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"})
            or (kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"} <= 0)
            or (kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"} > time())
            or (kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"}
                != kira_restore_test_last_success_timestamp_seconds{job="kira-restore-verification",service="kira-backend",environment="production"})
          )
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Kira restore verification telemetry is absent or invalid"}
